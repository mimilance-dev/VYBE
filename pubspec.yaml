name: vybe
description: A relaxed space to listen together.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.6.0
  firebase_auth: ^5.5.1
  firebase_core: ^3.15.2
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  json_annotation: ^4.9.0
  firebase_database: ^11.3.10
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true